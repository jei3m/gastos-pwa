name: Build Workflow
env:
  NODE_ENV: ${{ secrets.NODE_ENV }}
  MYSQL_HOST_PROD: ${{ secrets.MYSQL_HOST_PROD }}
  MYSQL_PORT_PROD: ${{ secrets.MYSQL_PORT_PROD }}
  MYSQL_USER_PROD: ${{ secrets.MYSQL_USER_PROD }}
  MYSQL_PASSWORD_PROD: ${{ secrets.MYSQL_PASSWORD_PROD }}
  MYSQL_DATABASE_PROD: ${{ secrets.MYSQL_DATABASE_PROD }}

on:
  push:
    branches: [dev, rewrite]
  pull_request:
    branches: [dev, rewrite]
  workflow_call:
  workflow_dispatch:

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.build.outputs.success }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Dependencies
        run: bun install

      - name: Add local bins to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run TypeScript Check
        run: vp run typecheck

      - name: Run Lint
        run: vp lint

      - name: Run DB Routines
        run: vp run db:routines

      - name: Build Vite+
        id: build
        run: |
          vp run build
          echo "success=true" >> $GITHUB_OUTPUT
